name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --frozen --extra platform --extra viz --extra validation --python ${{ matrix.python-version }}
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python examples/search.py
      - run: uv build
